<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alex Voice Demo</title>
    <style>
      :root {
        --bg: #0b1721;
        --panel: #102436;
        --text: #eaf4ff;
        --accent: #55d6be;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(circle at top, #1c3f57, var(--bg));
        color: var(--text);
      }
      .wrap {
        max-width: 860px;
        margin: 20px auto;
        padding: 16px;
      }
      .panel {
        background: linear-gradient(135deg, #163049, var(--panel));
        border: 1px solid #2f5670;
        border-radius: 12px;
        padding: 16px;
      }
      button {
        border: 0;
        background: var(--accent);
        color: #062318;
        font-weight: 700;
        border-radius: 10px;
        padding: 10px 14px;
        margin-right: 8px;
      }
      #log {
        white-space: pre-wrap;
        min-height: 280px;
        margin-top: 14px;
        padding: 12px;
        border-radius: 10px;
        background: #06111a;
        border: 1px solid #21445d;
      }
      .hint { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h2>Alex Voice Agent Local Demo</h2>
        <p class="hint">Legacy pipeline with Resemble voice output. Speak naturally and Alex responds with your Resemble voice.</p>
        <label for="legacyVoice">Legacy Voice:</label>
        <select id="legacyVoice">
          <option value="resemble" selected>Resemble TTS</option>
          <option value="browser">Browser TTS</option>
        </select>
        <button id="start">Start Voice Session</button>
        <button id="stop">Stop</button>
        <div id="status" class="hint"></div>
        <div id="log"></div>
      </div>
    </div>

    <script>
      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const startBtn = document.getElementById("start");
      const stopBtn = document.getElementById("stop");
      const legacyVoiceSelect = document.getElementById("legacyVoice");

      let ws;
      let audioContext;
      let scriptNode;
      let mediaStream;
      let recognizer;
      let started = false;
      let pendingBargeIn = false;

      let activeAudioSource;
      let activeAudioElement;

      const log = (line) => {
        logEl.textContent += `${line}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      };

      const setStatus = (text) => {
        statusEl.textContent = text;
      };

      function float32ToInt16Base64(floatBuffer) {
        const int16 = new Int16Array(floatBuffer.length);
        for (let i = 0; i < floatBuffer.length; i++) {
          const s = Math.max(-1, Math.min(1, floatBuffer[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        return btoa(String.fromCharCode(...new Uint8Array(int16.buffer)));
      }

      function setupRecognizer() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          log("SpeechRecognition unavailable. Audio still streams; STT adapter must be configured server-side.");
          return;
        }

        recognizer = new SR();
        recognizer.lang = "en-CA";
        recognizer.continuous = true;
        recognizer.interimResults = true;

        recognizer.onresult = (event) => {
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            const transcript = result[0].transcript.trim();
            if (!transcript) continue;

            if (result.isFinal) {
              pendingBargeIn = false;
              log(`YOU: ${transcript}`);
            }

            ws.send(
              JSON.stringify({
                type: "transcript",
                text: transcript,
                final: result.isFinal,
                confidence: result[0].confidence || 0.9
              })
            );
          }
        };

        recognizer.onend = () => {
          if (started) recognizer.start();
        };

        recognizer.start();
      }

      function speak(text) {
        if (!text) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 0.94;
        utter.pitch = 1.02;
        utter.volume = 1.0;
        speechSynthesis.speak(utter);
      }

      async function speakWithResemble(text) {
        const streamResp = await fetch("/api/resemble/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const streamType = streamResp.headers.get("content-type") || "";
        if (streamResp.ok && streamType.includes("audio/")) {
          const audioBlob = await streamResp.blob();
          const url = URL.createObjectURL(audioBlob);
          if (activeAudioElement) {
            activeAudioElement.pause();
            activeAudioElement.src = "";
          }
          const audio = new Audio(url);
          activeAudioElement = audio;
          audio.onended = () => URL.revokeObjectURL(url);
          await audio.play();
          return;
        }

        const fallbackResp = await fetch("/api/resemble/synthesize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await fallbackResp.json();
        if (!fallbackResp.ok) throw new Error(`Resemble error: ${JSON.stringify(data)}`);

        const bytes = Uint8Array.from(atob(data.audioBase64), (c) => c.charCodeAt(0));
        if (!audioContext) audioContext = new AudioContext();
        const decoded = await audioContext.decodeAudioData(bytes.buffer.slice(0));
        if (activeAudioSource) {
          try { activeAudioSource.stop(); } catch (_) {}
        }
        const source = audioContext.createBufferSource();
        source.buffer = decoded;
        source.connect(audioContext.destination);
        source.start();
        activeAudioSource = source;
      }

      async function setupLegacyMic() {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        audioContext = new AudioContext({ sampleRate: 16000 });
        const src = audioContext.createMediaStreamSource(mediaStream);
        scriptNode = audioContext.createScriptProcessor(1024, 1, 1);
        src.connect(scriptNode);
        scriptNode.connect(audioContext.destination);

        scriptNode.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          const payload = float32ToInt16Base64(input);
          ws.send(JSON.stringify({ type: "audio", pcm16: payload, sampleRate: 16000 }));
        };
      }

      async function startLegacyLocal() {
        ws = new WebSocket(`${location.origin.replace("http", "ws")}/ws/local`);
        ws.onopen = async () => {
          setStatus("Legacy local pipeline connected.");
          await setupLegacyMic();
          setupRecognizer();
          log("SYSTEM: Legacy local mode connected. Speak now.");
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "assistant_text") {
            log(`ALEX: ${msg.text}`);
            if (!msg.text.startsWith("[barge-in]")) {
              if (legacyVoiceSelect.value === "resemble") {
                speakWithResemble(msg.text).catch((error) => {
                  log(`SYSTEM: Resemble fallback to browser voice due to error: ${String(error)}`);
                  speak(msg.text);
                });
              } else {
                speak(msg.text);
              }
            }
          }
          if (msg.type === "transfer") {
            log(`SYSTEM: Transfer summary sent. ${msg.summary}`);
          }
          if (msg.type === "end") {
            log("SYSTEM: Session ended.");
          }
        };
      }

      startBtn.onclick = async () => {
        if (started) return;
        started = true;
        try {
          await startLegacyLocal();
        } catch (error) {
          setStatus("Failed to start voice session.");
          log(`SYSTEM ERROR: ${String(error)}`);
          started = false;
        }
      };

      stopBtn.onclick = () => {
        started = false;
        setStatus("Stopped.");

        if (recognizer) recognizer.stop();
        recognizer = undefined;

        speechSynthesis.cancel();
        if (activeAudioSource) {
          try {
            activeAudioSource.stop();
          } catch (_) {}
        }
        activeAudioSource = undefined;
        if (activeAudioElement) {
          activeAudioElement.pause();
          activeAudioElement.src = "";
        }
        activeAudioElement = undefined;

        if (scriptNode) scriptNode.disconnect();
        if (audioContext) audioContext.close();
        scriptNode = undefined;
        audioContext = undefined;

        if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = undefined;

        if (ws) ws.close();
        ws = undefined;

        pendingBargeIn = false;
        log("SYSTEM: Stopped.");
      };
    </script>
  </body>
</html>
