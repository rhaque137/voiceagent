<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alex Voice Demo</title>
    <style>
      :root {
        --bg: #0b1721;
        --panel: #102436;
        --text: #eaf4ff;
        --accent: #55d6be;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(circle at top, #1c3f57, var(--bg));
        color: var(--text);
      }
      .wrap {
        max-width: 860px;
        margin: 20px auto;
        padding: 16px;
      }
      .panel {
        background: linear-gradient(135deg, #163049, var(--panel));
        border: 1px solid #2f5670;
        border-radius: 12px;
        padding: 16px;
      }
      button {
        border: 0;
        background: var(--accent);
        color: #062318;
        font-weight: 700;
        border-radius: 10px;
        padding: 10px 14px;
        margin-right: 8px;
      }
      #log {
        white-space: pre-wrap;
        min-height: 280px;
        margin-top: 14px;
        padding: 12px;
        border-radius: 10px;
        background: #06111a;
        border: 1px solid #21445d;
      }
      .hint { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h2>Alex Voice Agent Local Demo</h2>
        <p class="hint">Press Start, allow microphone, then speak naturally. Alex speaks back via browser TTS.</p>
        <button id="start">Start Voice Session</button>
        <button id="stop">Stop</button>
        <div id="log"></div>
      </div>
    </div>

    <script>
      const logEl = document.getElementById("log");
      const startBtn = document.getElementById("start");
      const stopBtn = document.getElementById("stop");

      let ws;
      let audioContext;
      let scriptNode;
      let mediaStream;
      let recognizer;
      let speaking = false;
      let started = false;
      let canCaptureRecognition = true;
      let selectedVoice = null;
      let pendingBargeIn = false;

      const log = (line) => {
        logEl.textContent += `${line}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      };

      function float32ToInt16Base64(floatBuffer) {
        const int16 = new Int16Array(floatBuffer.length);
        for (let i = 0; i < floatBuffer.length; i++) {
          const s = Math.max(-1, Math.min(1, floatBuffer[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        return btoa(String.fromCharCode(...new Uint8Array(int16.buffer)));
      }

      function setupRecognizer() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          log("SpeechRecognition unavailable. Audio still streams; STT adapter must be configured server-side.");
          return;
        }

        recognizer = new SR();
        recognizer.lang = "en-CA";
        recognizer.continuous = true;
        recognizer.interimResults = true;

        recognizer.onresult = (event) => {
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            const transcript = result[0].transcript.trim();
            if (!transcript) continue;

            // If user starts talking while Alex is speaking, interrupt immediately.
            if (speaking && !pendingBargeIn) {
              pendingBargeIn = true;
              speechSynthesis.cancel();
              speaking = false;
              canCaptureRecognition = true;
              ws.send(JSON.stringify({ type: "barge_in" }));
              log("[barge-in] You interrupted Alex.");
            }

            if (!canCaptureRecognition) continue;

            ws.send(JSON.stringify({
              type: "transcript",
              text: transcript,
              final: result.isFinal,
              confidence: result[0].confidence || 0.9
            }));

            if (result.isFinal) {
              pendingBargeIn = false;
              log(`YOU: ${transcript}`);
            }
          }
        };

        recognizer.onend = () => {
          if (started) recognizer.start();
        };

        recognizer.start();
      }

      function speak(text) {
        if (!text) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 0.94;
        utter.pitch = 1.02;
        utter.volume = 1.0;
        if (selectedVoice) utter.voice = selectedVoice;
        utter.onstart = () => {
          speaking = true;
          canCaptureRecognition = false;
          pendingBargeIn = false;
        };
        utter.onend = () => {
          speaking = false;
          canCaptureRecognition = true;
          pendingBargeIn = false;
        };
        speechSynthesis.speak(utter);
      }

      function chooseNaturalVoice() {
        const voices = speechSynthesis.getVoices() || [];
        if (!voices.length) return;
        const preferredNames = [
          "Samantha",
          "Google US English",
          "Google UK English Female",
          "Ava",
          "Karen",
          "Moira"
        ];
        selectedVoice =
          voices.find((v) => preferredNames.some((name) => v.name.includes(name))) ||
          voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("en")) ||
          voices[0];
      }

      function setupMic() {
        return navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        }).then((stream) => {
          mediaStream = stream;
          audioContext = new AudioContext({ sampleRate: 16000 });
          const src = audioContext.createMediaStreamSource(stream);
          scriptNode = audioContext.createScriptProcessor(1024, 1, 1);
          src.connect(scriptNode);
          scriptNode.connect(audioContext.destination);

          scriptNode.onaudioprocess = (event) => {
            const input = event.inputBuffer.getChannelData(0);
            const payload = float32ToInt16Base64(input);
            ws.send(JSON.stringify({ type: "audio", pcm16: payload, sampleRate: 16000 }));
          };
        });
      }

      startBtn.onclick = async () => {
        if (started) return;
        ws = new WebSocket(`${location.origin.replace("http", "ws")}/ws/local`);
        ws.onopen = async () => {
          started = true;
          chooseNaturalVoice();
          speechSynthesis.onvoiceschanged = chooseNaturalVoice;
          await setupMic();
          setupRecognizer();
          log("Connected. Speak now.");
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "assistant_text") {
            log(`ALEX: ${msg.text}`);
            if (!msg.text.startsWith("[barge-in]")) speak(msg.text);
          }
          if (msg.type === "transfer") {
            log(`SYSTEM: Transfer summary sent. ${msg.summary}`);
          }
          if (msg.type === "end") {
            log("SYSTEM: Session ended.");
          }
        };
      };

      stopBtn.onclick = () => {
        started = false;
        if (recognizer) recognizer.stop();
        speechSynthesis.cancel();
        if (scriptNode) scriptNode.disconnect();
        if (audioContext) audioContext.close();
        if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
        if (ws) ws.close();
        log("Stopped.");
      };
    </script>
  </body>
</html>
