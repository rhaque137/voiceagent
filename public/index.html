<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alex Voice Demo</title>
    <style>
      :root {
        --bg: #0b1721;
        --panel: #102436;
        --text: #eaf4ff;
        --accent: #55d6be;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(circle at top, #1c3f57, var(--bg));
        color: var(--text);
      }
      .wrap {
        max-width: 860px;
        margin: 20px auto;
        padding: 16px;
      }
      .panel {
        background: linear-gradient(135deg, #163049, var(--panel));
        border: 1px solid #2f5670;
        border-radius: 12px;
        padding: 16px;
      }
      button {
        border: 0;
        background: var(--accent);
        color: #062318;
        font-weight: 700;
        border-radius: 10px;
        padding: 10px 14px;
        margin-right: 8px;
      }
      #log {
        white-space: pre-wrap;
        min-height: 280px;
        margin-top: 14px;
        padding: 12px;
        border-radius: 10px;
        background: #06111a;
        border: 1px solid #21445d;
      }
      .hint { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h2>Alex Voice Agent Local Demo</h2>
        <p class="hint">Default mode uses OpenAI real-time voice-to-voice (WebRTC). Legacy mode is available for fallback testing.</p>
        <label for="mode">Mode:</label>
        <select id="mode">
          <option value="openai-realtime" selected>OpenAI Realtime Voice (Recommended)</option>
          <option value="legacy-local">Legacy Local Pipeline</option>
        </select>
        <button id="start">Start Voice Session</button>
        <button id="stop">Stop</button>
        <div id="status" class="hint"></div>
        <div id="log"></div>
      </div>
    </div>

    <script>
      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const startBtn = document.getElementById("start");
      const stopBtn = document.getElementById("stop");
      const modeSelect = document.getElementById("mode");

      let ws;
      let audioContext;
      let scriptNode;
      let mediaStream;
      let recognizer;
      let started = false;
      let pendingBargeIn = false;

      let realtimePc;
      let realtimeDc;
      let realtimeAudioEl;

      const log = (line) => {
        logEl.textContent += `${line}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      };

      const setStatus = (text) => {
        statusEl.textContent = text;
      };

      function float32ToInt16Base64(floatBuffer) {
        const int16 = new Int16Array(floatBuffer.length);
        for (let i = 0; i < floatBuffer.length; i++) {
          const s = Math.max(-1, Math.min(1, floatBuffer[i]));
          int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        return btoa(String.fromCharCode(...new Uint8Array(int16.buffer)));
      }

      async function startOpenAiRealtime() {
        setStatus("Creating OpenAI realtime session...");
        log("SYSTEM: Starting OpenAI voice-to-voice session.");

        const tokenResponse = await fetch("/api/openai/realtime/session", { method: "POST" });
        const tokenData = await tokenResponse.json();
        if (!tokenResponse.ok) {
          throw new Error(`Session creation failed: ${JSON.stringify(tokenData)}`);
        }

        const ephemeralKey = tokenData?.client_secret?.value;
        const model = tokenData?.model || "gpt-realtime";
        if (!ephemeralKey) {
          throw new Error("Realtime session missing client_secret.value");
        }

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        realtimePc = new RTCPeerConnection();
        realtimeAudioEl = document.createElement("audio");
        realtimeAudioEl.autoplay = true;
        realtimePc.ontrack = (event) => {
          realtimeAudioEl.srcObject = event.streams[0];
        };

        for (const track of mediaStream.getTracks()) {
          realtimePc.addTrack(track, mediaStream);
        }

        realtimeDc = realtimePc.createDataChannel("oai-events");
        realtimeDc.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "conversation.item.input_audio_transcription.completed") {
            log(`YOU: ${msg.transcript}`);
          }
          if (msg.type === "response.audio_transcript.done") {
            log(`ALEX: ${msg.transcript}`);
          }
          if (msg.type === "error") {
            log(`SYSTEM ERROR: ${JSON.stringify(msg.error || msg)}`);
          }
        };

        realtimeDc.onopen = () => {
          setStatus("OpenAI realtime connected.");
          realtimeDc.send(
            JSON.stringify({
              type: "session.update",
              session: {
                instructions:
                  "You are Alex, a warm and natural phone assistant for a doctor's office. Keep responses short and conversational. Ask one question at a time. Never provide medical diagnosis or treatment advice.",
                turn_detection: {
                  type: "server_vad",
                  threshold: 0.5,
                  prefix_padding_ms: 250,
                  silence_duration_ms: 450
                }
              }
            })
          );
          log("SYSTEM: OpenAI realtime connected. Start talking.");
        };

        const offer = await realtimePc.createOffer();
        await realtimePc.setLocalDescription(offer);

        const baseUrl = "https://api.openai.com/v1/realtime";
        const sdpResponse = await fetch(`${baseUrl}?model=${encodeURIComponent(model)}`, {
          method: "POST",
          body: offer.sdp,
          headers: {
            Authorization: `Bearer ${ephemeralKey}`,
            "Content-Type": "application/sdp"
          }
        });

        if (!sdpResponse.ok) {
          const errText = await sdpResponse.text();
          throw new Error(`Realtime SDP negotiation failed: ${errText}`);
        }

        const answerSdp = await sdpResponse.text();
        await realtimePc.setRemoteDescription({ type: "answer", sdp: answerSdp });
      }

      function setupRecognizer() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          log("SpeechRecognition unavailable. Audio still streams; STT adapter must be configured server-side.");
          return;
        }

        recognizer = new SR();
        recognizer.lang = "en-CA";
        recognizer.continuous = true;
        recognizer.interimResults = true;

        recognizer.onresult = (event) => {
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            const transcript = result[0].transcript.trim();
            if (!transcript) continue;

            if (result.isFinal) {
              pendingBargeIn = false;
              log(`YOU: ${transcript}`);
            }

            ws.send(
              JSON.stringify({
                type: "transcript",
                text: transcript,
                final: result.isFinal,
                confidence: result[0].confidence || 0.9
              })
            );
          }
        };

        recognizer.onend = () => {
          if (started) recognizer.start();
        };

        recognizer.start();
      }

      function speak(text) {
        if (!text) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 0.94;
        utter.pitch = 1.02;
        utter.volume = 1.0;
        speechSynthesis.speak(utter);
      }

      async function setupLegacyMic() {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        audioContext = new AudioContext({ sampleRate: 16000 });
        const src = audioContext.createMediaStreamSource(mediaStream);
        scriptNode = audioContext.createScriptProcessor(1024, 1, 1);
        src.connect(scriptNode);
        scriptNode.connect(audioContext.destination);

        scriptNode.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          const payload = float32ToInt16Base64(input);
          ws.send(JSON.stringify({ type: "audio", pcm16: payload, sampleRate: 16000 }));
        };
      }

      async function startLegacyLocal() {
        ws = new WebSocket(`${location.origin.replace("http", "ws")}/ws/local`);
        ws.onopen = async () => {
          setStatus("Legacy local pipeline connected.");
          await setupLegacyMic();
          setupRecognizer();
          log("SYSTEM: Legacy local mode connected. Speak now.");
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "assistant_text") {
            log(`ALEX: ${msg.text}`);
            if (!msg.text.startsWith("[barge-in]")) speak(msg.text);
          }
          if (msg.type === "transfer") {
            log(`SYSTEM: Transfer summary sent. ${msg.summary}`);
          }
          if (msg.type === "end") {
            log("SYSTEM: Session ended.");
          }
        };
      }

      startBtn.onclick = async () => {
        if (started) return;
        started = true;
        const mode = modeSelect.value;
        try {
          if (mode === "openai-realtime") {
            await startOpenAiRealtime();
          } else {
            await startLegacyLocal();
          }
        } catch (error) {
          setStatus("Failed to start voice session.");
          log(`SYSTEM ERROR: ${String(error)}`);
          started = false;
        }
      };

      stopBtn.onclick = () => {
        started = false;
        setStatus("Stopped.");

        if (recognizer) recognizer.stop();
        recognizer = undefined;

        speechSynthesis.cancel();

        if (scriptNode) scriptNode.disconnect();
        if (audioContext) audioContext.close();
        scriptNode = undefined;
        audioContext = undefined;

        if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = undefined;

        if (ws) ws.close();
        ws = undefined;

        if (realtimeDc) realtimeDc.close();
        realtimeDc = undefined;
        if (realtimePc) realtimePc.close();
        realtimePc = undefined;
        if (realtimeAudioEl) {
          realtimeAudioEl.srcObject = null;
        }
        realtimeAudioEl = undefined;
        pendingBargeIn = false;
        log("SYSTEM: Stopped.");
      };
    </script>
  </body>
</html>
